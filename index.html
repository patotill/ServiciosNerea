<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios Nerea - Login</title>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 m-4 border-t-4 border-blue-500">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">Servicios y Reparaciones NEREA</h1>
        <p class="text-gray-500">Ingresa a tu cuenta para continuar</p>
      </div>

      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="usuario@correo.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
          Iniciar Sesión
        </button>
      </form>
      
      <!-- Separador visual -->
      <div class="mt-8 flex items-center justify-center space-x-4">
        <span class="h-px w-full bg-gray-300"></span>
        <span class="text-sm font-medium text-gray-400 uppercase tracking-wider">O</span>
        <span class="h-px w-full bg-gray-300"></span>
      </div>

      <!-- Opciones de registro -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600 mb-4">¿No tienes una cuenta? Regístrate como:</p>
        
        <div class="flex flex-col space-y-3 sm:flex-row sm:space-y-0 sm:space-x-3">
          <a href="/registro-cliente.html" class="w-full flex justify-center items-center py-2 px-4 border-2 border-blue-600 rounded-lg shadow-sm text-sm font-medium text-blue-600 bg-transparent hover:bg-blue-50 transition-colors">
            Cliente
          </a>
          <a href="/registro-profesional.html" class="w-full flex justify-center items-center py-2 px-4 border-2 border-green-600 rounded-lg shadow-sm text-sm font-medium text-green-600 bg-transparent hover:bg-green-50 transition-colors">
            Profesional
          </a>
        </div>
      </div>

      <!-- LOGIN PARA EL ADMIN -->
      <div class="mt-8 text-center">
        <a href="/admin.html" class="text-xs text-gray-400 hover:text-gray-600 transition-colors underline">
          Ingresar como administrador
        </a>
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
